<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AKFAA Coffee Shop | Admin Dashboard</title>


    <style>

        /* =========================================
           AKFAA ADMIN DASHBOARD
           ========================================= */

        :root {
            --dark-green: #10251b;
            --header-green: #0a1a12;
            --card-green: #1c3829;
            --gold: #d4af37;
            --cream: #f8f5ee;
            --new: #e74c3c;
            --preparing: #f39c12;
            --ready: #27ae60;
            --completed: #3498db;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: var(--dark-green);
            color: white;
        }


        /* =========================================
           HEADER
           ========================================= */

        .admin-header {
            background: var(--header-green);
            border-bottom: 2px solid var(--gold);
            padding: 25px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }


        .admin-header h1 {
            margin: 0;
            color: var(--gold);
            font-size: 30px;
        }


        .admin-header .arabic-name {
            margin: 8px 0;
            font-size: 20px;
            color: var(--cream);
        }


        .admin-header p {
            margin: 8px 0 0;
            color: #cccccc;
        }

        .live-indicator {
            display: inline-block;
            margin-left: 10px;
            width: 10px;
            height: 10px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }


        /* =========================================
           FILTER TABS
           ========================================= */

        .filter-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 15px 20px;
            flex-wrap: wrap;
            background: var(--header-green);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .filter-tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }

        .filter-tab:hover {
            background: rgba(255,255,255,0.1);
        }

        .filter-tab.active {
            background: var(--gold);
            color: #111;
            border-color: var(--gold);
        }

        .order-count {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 5px;
        }

        .filter-tab.active .order-count {
            background: rgba(0,0,0,0.2);
        }


        /* =========================================
           MAIN DASHBOARD
           ========================================= */

        .dashboard {
            max-width: 1400px;
            margin: auto;
            padding: 30px 20px;
        }


        .dashboard-title {
            color: var(--gold);
            margin: 0 0 25px;
        }


        /* =========================================
           ORDERS GRID
           ========================================= */

        .orders {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(320px, 1fr)
                );
            gap: 20px;
        }


        /* =========================================
           ORDER CARD
           ========================================= */

        .order {
            background: var(--card-green);
            border-radius: 15px;
            padding: 20px;
            border-left: 7px solid var(--gold);
            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.25);
            transition: 0.3s ease;
        }

        .order.updating {
            opacity: 0.6;
            pointer-events: none;
        }


        /* =========================================
           STATUS CARD COLORS
           ========================================= */

        .order.new {
            border-left-color: var(--new);
        }


        .order.preparing {
            border-left-color: var(--preparing);
        }


        .order.ready {
            border-left-color: var(--ready);
        }


        .order.completed {
            border-left-color: var(--completed);
            opacity: 0.85;
        }


        /* =========================================
           ORDER TOP
           ========================================= */

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }


        .order-number {
            margin: 0;
            color: var(--gold);
            font-size: 22px;
        }


        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }


        .status-new {
            background: var(--new);
            color: white;
        }


        .status-preparing {
            background: var(--preparing);
            color: #111;
        }


        .status-ready {
            background: var(--ready);
            color: white;
        }


        .status-completed {
            background: var(--completed);
            color: white;
        }


        /* =========================================
           ORDER INFORMATION
           ========================================= */

        .order-info {
            background:
                rgba(255, 255, 255, 0.04);

            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }


        .order-info p {
            margin: 8px 0;
            line-height: 1.5;
        }


        .order-info b {
            color: var(--gold);
        }


        /* =========================================
           ITEMS
           ========================================= */

        .items-title {
            color: var(--gold);
            margin: 15px 0 10px;
        }


        .items-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }


        .items-list li {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.1);
        }


        .item-name {
            flex: 1;
        }


        .item-price {
            color: var(--gold);
            white-space: nowrap;
        }


        /* =========================================
           TOTAL
           ========================================= */

        .total {
            margin-top: 20px;
            padding: 15px;

            background:
                rgba(212, 175, 55, 0.12);

            border-radius: 10px;
            font-size: 21px;
            color: var(--gold);
            font-weight: bold;
            text-align: center;
        }


        /* =========================================
           CUSTOMER NOTE
           ========================================= */

        .note {
            margin-top: 15px;
            padding: 12px;

            background:
                rgba(255, 255, 255, 0.06);

            border-radius: 10px;
            line-height: 1.5;
        }


        /* =========================================
           ACTION BUTTONS
           ========================================= */

        .actions {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 20px;
        }


        .actions button {
            width: 100%;
            border: none;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s ease;
        }


        .actions button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }


        .preparing-btn {
            background: var(--preparing);
            color: #111;
        }


        .ready-btn {
            background: var(--ready);
            color: white;
        }


        .complete-btn {
            background: var(--completed);
            color: white;
        }

        .delete-btn {
            background: #c0392b;
            color: white;
        }

        .time-btn {
            padding: 8px 14px;
            background: #8e44ad;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .time-btn:hover {
            background: #9b59b6;
            transform: translateY(-2px);
        }


        /* =========================================
           TOAST NOTIFICATION
           ========================================= */

        .admin-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card-green);
            border: 1px solid var(--gold);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .admin-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .admin-toast.error {
            border-color: var(--new);
        }


        /* =========================================
           EMPTY ORDERS
           ========================================= */

        .no-orders {
            grid-column: 1 / -1;
            text-align: center;
            background: var(--card-green);
            padding: 50px 20px;
            border-radius: 15px;
            color: #cccccc;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            .dashboard {
                padding: 20px 12px;
            }


            .admin-header h1 {
                font-size: 23px;
            }


            .orders {
                grid-template-columns: 1fr;
            }


            .actions {
                grid-template-columns: 1fr;
            }


            .order-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-toast {
                left: 15px;
                right: 15px;
                bottom: 15px;
            }

        }

        /* =========================================
           REPORTS STYLES
           ========================================= */

        .report-tab {
            background: rgba(52, 152, 219, 0.15);
            border-color: #3498db;
            color: #3498db;
        }

        .report-tab.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        .reports-container {
            grid-column: 1 / -1;
        }

        .report-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .report-card {
            background: var(--card-green);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .report-card-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .report-card-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--gold);
        }

        .report-card-sub {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .report-section {
            background: var(--card-green);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .report-section h3 {
            color: var(--gold);
            margin: 0 0 16px;
            font-size: 16px;
        }

        .top-items-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .top-items-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .top-items-list li:last-child {
            border-bottom: none;
        }

        .top-item-rank {
            width: 28px;
            height: 28px;
            background: var(--gold);
            color: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .top-item-name {
            flex: 1;
            font-size: 14px;
        }

        .top-item-qty {
            color: var(--gold);
            font-weight: 700;
            font-size: 14px;
        }

        .chart-bar-container {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 120px;
            padding-top: 10px;
        }

        .chart-bar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            max-width: 40px;
            background: linear-gradient(to top, var(--gold), #f5d76e);
            border-radius: 6px 6px 0 0;
            min-height: 4px;
            transition: 0.3s;
        }

        .chart-bar-label {
            font-size: 10px;
            color: #888;
            margin-top: 6px;
            text-align: center;
        }

        .chart-bar-value {
            font-size: 10px;
            color: var(--gold);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .breakdown-item {
            text-align: center;
            padding: 14px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }

        .breakdown-item .b-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .breakdown-item .b-value {
            font-size: 20px;
            font-weight: 800;
            color: white;
        }

    </style>

</head>


<body>


    <!-- =========================================
         ADMIN HEADER
         ========================================= -->

    <header class="admin-header">

        <h1>
            ☕ AKFAA Coffee Shop
            <span class="live-indicator"></span>
        </h1>


        <div class="arabic-name">

            أكفاء للأعمال والتطوير

        </div>


        <p>

            Order Management Dashboard (Live)

        </p>

    </header>


    <!-- =========================================
         FILTER TABS
         ========================================= -->

    <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-filter="ALL">
            All
        </button>
        <button class="filter-tab" data-filter="NEW">
            New
        </button>
        <button class="filter-tab" data-filter="PREPARING">
            Preparing
        </button>
        <button class="filter-tab" data-filter="READY">
            Ready
        </button>
        <button class="filter-tab" data-filter="COMPLETED">
            Completed
        </button>
        <button class="filter-tab report-tab" data-filter="REPORTS">
            📊 Reports
        </button>
    </div>


    <!-- =========================================
         DASHBOARD
         ========================================= -->

    <main class="dashboard">


        <h2 class="dashboard-title" id="dashboard-title">

            📋 Current Orders

        </h2>


        <div class="orders" id="orders-container">

            <div class="no-orders">
                <h2>Loading orders...</h2>
                <p>Please wait.</p>
            </div>

        </div>


    </main>


    <!-- =========================================
         ADMIN JAVASCRIPT
         ========================================= -->

    <script>

        // =============================================
        // STATE
        // =============================================

        let allOrders = [];
        let activeFilter = "ALL";
        let refreshInterval = null;
        let lastOrderCount = 0;


        // =============================================
        // NOTIFICATION SOUND
        // =============================================

        function playNotificationSound() {
            // Create a beep sound using Web Audio API
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var oscillator = ctx.createOscillator();
                var gain = ctx.createGain();

                oscillator.connect(gain);
                gain.connect(ctx.destination);

                oscillator.type = "sine";
                oscillator.frequency.value = 800;
                gain.gain.value = 0.3;

                oscillator.start();
                oscillator.stop(ctx.currentTime + 0.3);

                // Second beep
                setTimeout(function() {
                    var osc2 = ctx.createOscillator();
                    var gain2 = ctx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.type = "sine";
                    osc2.frequency.value = 1000;
                    gain2.gain.value = 0.3;
                    osc2.start();
                    osc2.stop(ctx.currentTime + 0.3);
                }, 350);
            } catch(e) {}
        }

        function showBrowserNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: "/static/images/icons/icon-192x192.png"
                });
            }
        }

        // Request notification permission on load
        if ("Notification" in window && Notification.permission === "default") {
            Notification.requestPermission();
        }


        // =============================================
        // INITIALIZE
        // =============================================

        document.addEventListener("DOMContentLoaded", function() {
            setupFilterTabs();
            fetchOrders();

            // Auto-refresh every 5 seconds
            refreshInterval = setInterval(fetchOrders, 5000);
        });


        // =============================================
        // FILTER TABS
        // =============================================

        function setupFilterTabs() {
            const tabs = document.querySelectorAll(".filter-tab");

            tabs.forEach(function(tab) {
                tab.addEventListener("click", function() {
                    activeFilter = this.dataset.filter;

                    tabs.forEach(function(t) {
                        t.classList.remove("active");
                    });

                    this.classList.add("active");
                    renderOrders();
                });
            });
        }


        // =============================================
        // FETCH ORDERS FROM API
        // =============================================

        async function fetchOrders() {
            try {
                const response = await fetch("/api/orders");
                const data = await response.json();

                if (data.success) {
                    // Check for new orders
                    if (lastOrderCount > 0 && data.orders.length > lastOrderCount) {
                        var newCount = data.orders.length - lastOrderCount;
                        playNotificationSound();
                        showBrowserNotification(
                            "🆕 New Order!",
                            newCount + " new order(s) received"
                        );
                        showToast("🆕 " + newCount + " new order(s) received!");
                    }
                    lastOrderCount = data.orders.length;

                    allOrders = data.orders;
                    renderOrders();
                    updateFilterCounts();
                }
            } catch (error) {
                console.error("Failed to fetch orders:", error);
            }
        }


        // =============================================
        // UPDATE FILTER COUNTS
        // =============================================

        function updateFilterCounts() {
            const counts = {
                ALL: allOrders.length,
                NEW: 0,
                PREPARING: 0,
                READY: 0,
                COMPLETED: 0
            };

            allOrders.forEach(function(order) {
                if (counts[order.status] !== undefined) {
                    counts[order.status]++;
                }
            });

            const tabs = document.querySelectorAll(".filter-tab");
            tabs.forEach(function(tab) {
                const filter = tab.dataset.filter;
                const count = counts[filter] || 0;
                const countSpan = tab.querySelector(".order-count");

                if (countSpan) {
                    countSpan.textContent = count;
                } else {
                    const span = document.createElement("span");
                    span.className = "order-count";
                    span.textContent = count;
                    tab.appendChild(span);
                }
            });
        }


        // =============================================
        // RENDER ORDERS
        // =============================================

        function renderOrders() {
            const container = document.getElementById("orders-container");

            // Show reports view
            if (activeFilter === "REPORTS") {
                fetchReports();
                return;
            }

            const filtered = activeFilter === "ALL"
                ? allOrders
                : allOrders.filter(function(o) { return o.status === activeFilter; });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="no-orders">
                        <h2>No ${activeFilter === "ALL" ? "" : activeFilter.toLowerCase()} orders</h2>
                        <p>New customer orders will appear here automatically.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(function(order) {
                return renderOrderCard(order);
            }).join("");

            // Attach button events
            attachStatusButtons();
        }


        // =============================================
        // RENDER SINGLE ORDER CARD
        // =============================================

        function renderOrderCard(order) {
            const statusClass = order.status.toLowerCase();

            const statusBadge = `<span class="status status-${statusClass}">${order.status}</span>`;

            const itemsHTML = order.items.map(function(item) {
                const lineTotal = (item.price * item.quantity).toFixed(3);
                return `
                    <li>
                        <span class="item-name">
                            ${escapeHTML(item.item_name)} &times; ${item.quantity}
                        </span>
                        <span class="item-price">
                            OMR ${lineTotal}
                        </span>
                    </li>
                `;
            }).join("");

            const noteHTML = order.instructions
                ? `<div class="note">📝 <b>Customer Note:</b> ${escapeHTML(order.instructions)}</div>`
                : "";

            let actionsHTML = "";

            if (order.status !== "COMPLETED") {
                let buttons = "";

                if (order.status !== "PREPARING") {
                    buttons += `
                        <button class="preparing-btn" data-order="${order.id}" data-status="PREPARING">
                            👨‍🍳 Preparing
                        </button>
                    `;
                }

                if (order.status !== "READY") {
                    buttons += `
                        <button class="ready-btn" data-order="${order.id}" data-status="READY">
                            ✅ Ready
                        </button>
                    `;
                }

                buttons += `
                    <button class="complete-btn" data-order="${order.id}" data-status="COMPLETED">
                        ✔ Completed
                    </button>
                `;

                buttons += `
                    <button class="delete-btn" data-order="${order.id}" data-action="delete">
                        🗑 Delete
                    </button>
                `;

                // Delivery time buttons
                let timeButtons = `
                    <div class="time-actions" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
                        <button class="time-btn" data-order="${order.id}" data-time="10 min">⏰ 10m</button>
                        <button class="time-btn" data-order="${order.id}" data-time="15 min">⏰ 15m</button>
                        <button class="time-btn" data-order="${order.id}" data-time="20 min">⏰ 20m</button>
                        <button class="time-btn" data-order="${order.id}" data-time="30 min">⏰ 30m</button>
                    </div>
                `;

                actionsHTML = `<div class="actions">${buttons}</div>${timeButtons}`;
            }

            return `
                <div class="order ${statusClass}" id="order-card-${order.id}">

                    <div class="order-top">
                        <h2 class="order-number">Order #${order.id}</h2>
                        ${statusBadge}
                    </div>

                    <div class="order-info">
                        <p><b>🪑 Table:</b> ${escapeHTML(order.table_number)}</p>
                        <p><b>🛍️ Type:</b> ${escapeHTML(order.order_type || 'Dine-in')}</p>
                        <p><b>⏰ Time:</b> ${escapeHTML(order.order_time || 'Not set')}</p>
                        <p><b>👤 Customer:</b> ${escapeHTML(order.customer_name)}</p>
                        <p><b>📞 Phone:</b> ${escapeHTML(order.customer_phone)}</p>
                        <p><b>💳 Payment:</b> ${escapeHTML(order.payment_method)}</p>
                        ${order.address ? '<p><b>📍 Address:</b> ' + escapeHTML(order.address) + '</p>' : ''}
                        ${order.map_link ? '<p><b>🗺️ Map:</b> <a href="' + escapeHTML(order.map_link) + '" target="_blank" rel="noopener" style="color:#4285F4;text-decoration:underline;">Open Location</a></p>' : ''}
                        <p><b>🕒 Ordered:</b> ${escapeHTML(order.created_at)}</p>
                    </div>

                    <h3 class="items-title">🍽️ Items</h3>

                    <ul class="items-list">
                        ${itemsHTML}
                    </ul>

                    <div class="total">
                        Total: OMR ${order.total.toFixed(3)}
                    </div>

                    ${noteHTML}

                    ${actionsHTML}

                </div>
            `;
        }


        // =============================================
        // ATTACH STATUS BUTTONS
        // =============================================

        function attachStatusButtons() {
            // Status update buttons
            const statusBtns = document.querySelectorAll("[data-status]");
            statusBtns.forEach(function(btn) {
                btn.addEventListener("click", function() {
                    const orderId = this.dataset.order;
                    const status = this.dataset.status;
                    updateOrderStatus(orderId, status);
                });
            });

            // Delete buttons
            const deleteBtns = document.querySelectorAll("[data-action='delete']");
            deleteBtns.forEach(function(btn) {
                btn.addEventListener("click", function() {
                    const orderId = this.dataset.order;
                    if (confirm("Delete order #" + orderId + "?")) {
                        deleteOrder(orderId);
                    }
                });
            });

            // Delivery time buttons
            const timeBtns = document.querySelectorAll(".time-btn");
            timeBtns.forEach(function(btn) {
                btn.addEventListener("click", function() {
                    const orderId = this.dataset.order;
                    const time = this.dataset.time;
                    setDeliveryTime(orderId, time);
                });
            });
        }


        // =============================================
        // UPDATE ORDER STATUS (AJAX)
        // =============================================

        async function updateOrderStatus(orderId, status) {
            const card = document.getElementById("order-card-" + orderId);
            if (card) card.classList.add("updating");

            try {
                const response = await fetch(
                    "/update-status/" + orderId + "/" + status,
                    { method: "POST" }
                );

                const data = await response.json();

                if (data.success) {
                    showToast("Order #" + orderId + " → " + status);
                    fetchOrders();
                } else {
                    showToast(data.message || "Failed to update", "error");
                }
            } catch (error) {
                showToast("Network error", "error");
            }

            if (card) card.classList.remove("updating");
        }


        // =============================================
        // DELETE ORDER (AJAX)
        // =============================================

        async function deleteOrder(orderId) {
            try {
                const response = await fetch(
                    "/delete-order/" + orderId,
                    { method: "POST" }
                );

                const data = await response.json();

                if (data.success) {
                    showToast("Order #" + orderId + " deleted");
                    fetchOrders();
                } else {
                    showToast(data.message || "Failed to delete", "error");
                }
            } catch (error) {
                showToast("Network error", "error");
            }
        }


        // =============================================
        // SET DELIVERY TIME (AJAX)
        // =============================================

        async function setDeliveryTime(orderId, time) {
            try {
                const response = await fetch(
                    "/set-time/" + orderId + "/" + encodeURIComponent(time),
                    { method: "POST" }
                );

                const data = await response.json();

                if (data.success) {
                    showToast("Order #" + orderId + " → Delivery: " + time);
                    fetchOrders();
                } else {
                    showToast(data.message || "Failed", "error");
                }
            } catch (error) {
                showToast("Network error", "error");
            }
        }


        // =============================================
        // TOAST NOTIFICATION
        // =============================================

        function showToast(message, type) {
            const existing = document.querySelector(".admin-toast");
            if (existing) existing.remove();

            const toast = document.createElement("div");
            toast.className = "admin-toast" + (type === "error" ? " error" : "");
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(function() { toast.classList.add("show"); }, 10);

            setTimeout(function() {
                toast.classList.remove("show");
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }


        // =============================================
        // ESCAPE HTML
        // =============================================

        function escapeHTML(str) {
            if (!str) return "";
            const div = document.createElement("div");
            div.textContent = String(str);
            return div.innerHTML;
        }


        // =============================================
        // REPORTS
        // =============================================

        async function fetchReports() {
            const container = document.getElementById("orders-container");
            container.innerHTML = '<div class="no-orders"><h2>Loading reports...</h2></div>';

            try {
                const response = await fetch("/api/reports");
                const data = await response.json();

                if (data.success) {
                    renderReports(data);
                } else {
                    container.innerHTML = '<div class="no-orders"><h2>Failed to load reports</h2></div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="no-orders"><h2>Network error</h2></div>';
            }
        }

        function renderReports(data) {
            const container = document.getElementById("orders-container");
            const s = data.summary;

            // Revenue cards
            const cardsHTML = `
                <div class="report-cards">
                    <div class="report-card">
                        <div class="report-card-label">Today</div>
                        <div class="report-card-value">OMR ${s.today.revenue.toFixed(3)}</div>
                        <div class="report-card-sub">${s.today.orders} orders</div>
                    </div>
                    <div class="report-card">
                        <div class="report-card-label">This Week</div>
                        <div class="report-card-value">OMR ${s.week.revenue.toFixed(3)}</div>
                        <div class="report-card-sub">${s.week.orders} orders</div>
                    </div>
                    <div class="report-card">
                        <div class="report-card-label">This Month</div>
                        <div class="report-card-value">OMR ${s.month.revenue.toFixed(3)}</div>
                        <div class="report-card-sub">${s.month.orders} orders</div>
                    </div>
                    <div class="report-card">
                        <div class="report-card-label">This Quarter</div>
                        <div class="report-card-value">OMR ${s.quarter.revenue.toFixed(3)}</div>
                        <div class="report-card-sub">${s.quarter.orders} orders</div>
                    </div>
                    <div class="report-card">
                        <div class="report-card-label">This Year</div>
                        <div class="report-card-value">OMR ${s.year.revenue.toFixed(3)}</div>
                        <div class="report-card-sub">${s.year.orders} orders</div>
                    </div>
                    <div class="report-card">
                        <div class="report-card-label">All Time</div>
                        <div class="report-card-value">OMR ${s.total_revenue.toFixed(3)}</div>
                        <div class="report-card-sub">${s.total_orders} total orders</div>
                    </div>
                </div>
            `;

            // Daily revenue chart
            const maxRev = Math.max(...data.daily_revenue.map(function(d) { return d.revenue; }), 0.001);
            const chartHTML = `
                <div class="report-section">
                    <h3>📈 Last 7 Days Revenue</h3>
                    <div class="chart-bar-container">
                        ${data.daily_revenue.map(function(d) {
                            const height = Math.max((d.revenue / maxRev) * 100, 3);
                            const dayName = new Date(d.date).toLocaleDateString('en', {weekday: 'short'});
                            return '<div class="chart-bar-item">' +
                                '<span class="chart-bar-value">' + d.revenue.toFixed(3) + '</span>' +
                                '<div class="chart-bar" style="height:' + height + '%"></div>' +
                                '<span class="chart-bar-label">' + dayName + '</span>' +
                            '</div>';
                        }).join("")}
                    </div>
                </div>
            `;

            // Top selling items
            const topItemsHTML = `
                <div class="report-section">
                    <h3>🔥 Top Selling Items (Most Demand)</h3>
                    <ul class="top-items-list">
                        ${data.top_items.map(function(item, i) {
                            return '<li>' +
                                '<span class="top-item-rank">' + (i + 1) + '</span>' +
                                '<span class="top-item-name">' + escapeHTML(item.name) + '</span>' +
                                '<span class="top-item-qty">' + item.quantity + ' sold</span>' +
                            '</li>';
                        }).join("")}
                    </ul>
                    ${data.top_items.length === 0 ? '<p style="color:#888;text-align:center;">No sales data yet</p>' : ''}
                </div>
            `;

            // Order type breakdown
            const typeHTML = `
                <div class="report-section">
                    <h3>🛍️ Order Type Breakdown</h3>
                    <div class="breakdown-grid">
                        ${Object.entries(data.type_breakdown).map(function(entry) {
                            return '<div class="breakdown-item">' +
                                '<div class="b-label">' + escapeHTML(entry[0]) + '</div>' +
                                '<div class="b-value">' + entry[1] + '</div>' +
                            '</div>';
                        }).join("")}
                    </div>
                </div>
            `;

            // Status breakdown
            const statusHTML = `
                <div class="report-section">
                    <h3>📋 Order Status Breakdown</h3>
                    <div class="breakdown-grid">
                        ${Object.entries(data.status_breakdown).map(function(entry) {
                            return '<div class="breakdown-item">' +
                                '<div class="b-label">' + escapeHTML(entry[0]) + '</div>' +
                                '<div class="b-value">' + entry[1] + '</div>' +
                            '</div>';
                        }).join("")}
                    </div>
                </div>
            `;

            container.innerHTML = `
                <div class="reports-container">
                    ${cardsHTML}
                    ${chartHTML}
                    ${topItemsHTML}
                    ${typeHTML}
                    ${statusHTML}
                </div>
            `;
        }

    </script>


</body>

</html>
