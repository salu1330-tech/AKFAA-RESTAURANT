<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AKFAA Coffee Shop | Admin Dashboard</title>


    <style>

        /* =========================================
           AKFAA ADMIN DASHBOARD
           ========================================= */

        :root {
            --dark-green: #10251b;
            --header-green: #0a1a12;
            --card-green: #1c3829;
            --gold: #d4af37;
            --cream: #f8f5ee;
            --new: #e74c3c;
            --preparing: #f39c12;
            --ready: #27ae60;
            --completed: #3498db;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: var(--dark-green);
            color: white;
        }


        /* =========================================
           HEADER
           ========================================= */

        .admin-header {
            background: var(--header-green);
            border-bottom: 2px solid var(--gold);
            padding: 25px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }


        .admin-header h1 {
            margin: 0;
            color: var(--gold);
            font-size: 30px;
        }


        .admin-header .arabic-name {
            margin: 8px 0;
            font-size: 20px;
            color: var(--cream);
        }


        .admin-header p {
            margin: 8px 0 0;
            color: #cccccc;
        }

        .live-indicator {
            display: inline-block;
            margin-left: 10px;
            width: 10px;
            height: 10px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }


        /* =========================================
           FILTER TABS
           ========================================= */

        .filter-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 15px 20px;
            flex-wrap: wrap;
            background: var(--header-green);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .filter-tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }

        .filter-tab:hover {
            background: rgba(255,255,255,0.1);
        }

        .filter-tab.active {
            background: var(--gold);
            color: #111;
            border-color: var(--gold);
        }

        .order-count {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 5px;
        }

        .filter-tab.active .order-count {
            background: rgba(0,0,0,0.2);
        }


        /* =========================================
           MAIN DASHBOARD
           ========================================= */

        .dashboard {
            max-width: 1400px;
            margin: auto;
            padding: 30px 20px;
        }


        .dashboard-title {
            color: var(--gold);
            margin: 0 0 25px;
        }


        /* =========================================
           ORDERS GRID
           ========================================= */

        .orders {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(320px, 1fr)
                );
            gap: 20px;
        }


        /* =========================================
           ORDER CARD
           ========================================= */

        .order {
            background: var(--card-green);
            border-radius: 15px;
            padding: 20px;
            border-left: 7px solid var(--gold);
            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.25);
            transition: 0.3s ease;
        }

        .order.updating {
            opacity: 0.6;
            pointer-events: none;
        }


        /* =========================================
           STATUS CARD COLORS
           ========================================= */

        .order.new {
            border-left-color: var(--new);
        }


        .order.preparing {
            border-left-color: var(--preparing);
        }


        .order.ready {
            border-left-color: var(--ready);
        }


        .order.completed {
            border-left-color: var(--completed);
            opacity: 0.85;
        }


        /* =========================================
           ORDER TOP
           ========================================= */

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }


        .order-number {
            margin: 0;
            color: var(--gold);
            font-size: 22px;
        }


        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }


        .status-new {
            background: var(--new);
            color: white;
        }


        .status-preparing {
            background: var(--preparing);
            color: #111;
        }


        .status-ready {
            background: var(--ready);
            color: white;
        }


        .status-completed {
            background: var(--completed);
            color: white;
        }


        /* =========================================
           ORDER INFORMATION
           ========================================= */

        .order-info {
            background:
                rgba(255, 255, 255, 0.04);

            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }


        .order-info p {
            margin: 8px 0;
            line-height: 1.5;
        }


        .order-info b {
            color: var(--gold);
        }


        /* =========================================
           ITEMS
           ========================================= */

        .items-title {
            color: var(--gold);
            margin: 15px 0 10px;
        }


        .items-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }


        .items-list li {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.1);
        }


        .item-name {
            flex: 1;
        }


        .item-price {
            color: var(--gold);
            white-space: nowrap;
        }


        /* =========================================
           TOTAL
           ========================================= */

        .total {
            margin-top: 20px;
            padding: 15px;

            background:
                rgba(212, 175, 55, 0.12);

            border-radius: 10px;
            font-size: 21px;
            color: var(--gold);
            font-weight: bold;
            text-align: center;
        }


        /* =========================================
           CUSTOMER NOTE
           ========================================= */

        .note {
            margin-top: 15px;
            padding: 12px;

            background:
                rgba(255, 255, 255, 0.06);

            border-radius: 10px;
            line-height: 1.5;
        }


        /* =========================================
           ACTION BUTTONS
           ========================================= */

        .actions {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 20px;
        }


        .actions button {
            width: 100%;
            border: none;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s ease;
        }


        .actions button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }


        .preparing-btn {
            background: var(--preparing);
            color: #111;
        }


        .ready-btn {
            background: var(--ready);
            color: white;
        }


        .complete-btn {
            background: var(--completed);
            color: white;
        }

        .delete-btn {
            background: #c0392b;
            color: white;
        }


        /* =========================================
           TOAST NOTIFICATION
           ========================================= */

        .admin-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card-green);
            border: 1px solid var(--gold);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .admin-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .admin-toast.error {
            border-color: var(--new);
        }


        /* =========================================
           EMPTY ORDERS
           ========================================= */

        .no-orders {
            grid-column: 1 / -1;
            text-align: center;
            background: var(--card-green);
            padding: 50px 20px;
            border-radius: 15px;
            color: #cccccc;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            .dashboard {
                padding: 20px 12px;
            }


            .admin-header h1 {
                font-size: 23px;
            }


            .orders {
                grid-template-columns: 1fr;
            }


            .actions {
                grid-template-columns: 1fr;
            }


            .order-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-toast {
                left: 15px;
                right: 15px;
                bottom: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         ADMIN HEADER
         ========================================= -->

    <header class="admin-header">

        <h1>
            ☕ AKFAA Coffee Shop
            <span class="live-indicator"></span>
        </h1>


        <div class="arabic-name">

            أكفاء للأعمال والتطوير

        </div>


        <p>

            Order Management Dashboard (Live)

        </p>

    </header>


    <!-- =========================================
         FILTER TABS
         ========================================= -->

    <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-filter="ALL">
            All
        </button>
        <button class="filter-tab" data-filter="NEW">
            New
        </button>
        <button class="filter-tab" data-filter="PREPARING">
            Preparing
        </button>
        <button class="filter-tab" data-filter="READY">
            Ready
        </button>
        <button class="filter-tab" data-filter="COMPLETED">
            Completed
        </button>
    </div>


    <!-- =========================================
         DASHBOARD
         ========================================= -->

    <main class="dashboard">


        <h2 class="dashboard-title" id="dashboard-title">

            📋 Current Orders

        </h2>


        <div class="orders" id="orders-container">

            <div class="no-orders">
                <h2>Loading orders...</h2>
                <p>Please wait.</p>
            </div>

        </div>


    </main>


    <!-- =========================================
         ADMIN JAVASCRIPT
         ========================================= -->

    <script>

        // =============================================
        // STATE
        // =============================================

        let allOrders = [];
        let activeFilter = "ALL";
        let refreshInterval = null;


        // =============================================
        // INITIALIZE
        // =============================================

        document.addEventListener("DOMContentLoaded", function() {
            setupFilterTabs();
            fetchOrders();

            // Auto-refresh every 5 seconds
            refreshInterval = setInterval(fetchOrders, 5000);
        });


        // =============================================
        // FILTER TABS
        // =============================================

        function setupFilterTabs() {
            const tabs = document.querySelectorAll(".filter-tab");

            tabs.forEach(function(tab) {
                tab.addEventListener("click", function() {
                    activeFilter = this.dataset.filter;

                    tabs.forEach(function(t) {
                        t.classList.remove("active");
                    });

                    this.classList.add("active");
                    renderOrders();
                });
            });
        }


        // =============================================
        // FETCH ORDERS FROM API
        // =============================================

        async function fetchOrders() {
            try {
                const response = await fetch("/api/orders");
                const data = await response.json();

                if (data.success) {
                    allOrders = data.orders;
                    renderOrders();
                    updateFilterCounts();
                }
            } catch (error) {
                console.error("Failed to fetch orders:", error);
            }
        }


        // =============================================
        // UPDATE FILTER COUNTS
        // =============================================

        function updateFilterCounts() {
            const counts = {
                ALL: allOrders.length,
                NEW: 0,
                PREPARING: 0,
                READY: 0,
                COMPLETED: 0
            };

            allOrders.forEach(function(order) {
                if (counts[order.status] !== undefined) {
                    counts[order.status]++;
                }
            });

            const tabs = document.querySelectorAll(".filter-tab");
            tabs.forEach(function(tab) {
                const filter = tab.dataset.filter;
                const count = counts[filter] || 0;
                const countSpan = tab.querySelector(".order-count");

                if (countSpan) {
                    countSpan.textContent = count;
                } else {
                    const span = document.createElement("span");
                    span.className = "order-count";
                    span.textContent = count;
                    tab.appendChild(span);
                }
            });
        }


        // =============================================
        // RENDER ORDERS
        // =============================================

        function renderOrders() {
            const container = document.getElementById("orders-container");

            const filtered = activeFilter === "ALL"
                ? allOrders
                : allOrders.filter(function(o) { return o.status === activeFilter; });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="no-orders">
                        <h2>No ${activeFilter === "ALL" ? "" : activeFilter.toLowerCase()} orders</h2>
                        <p>New customer orders will appear here automatically.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(function(order) {
                return renderOrderCard(order);
            }).join("");

            // Attach button events
            attachStatusButtons();
        }


        // =============================================
        // RENDER SINGLE ORDER CARD
        // =============================================

        function renderOrderCard(order) {
            const statusClass = order.status.toLowerCase();

            const statusBadge = `<span class="status status-${statusClass}">${order.status}</span>`;

            const itemsHTML = order.items.map(function(item) {
                const lineTotal = (item.price * item.quantity).toFixed(3);
                return `
                    <li>
                        <span class="item-name">
                            ${escapeHTML(item.item_name)} &times; ${item.quantity}
                        </span>
                        <span class="item-price">
                            OMR ${lineTotal}
                        </span>
                    </li>
                `;
            }).join("");

            const noteHTML = order.instructions
                ? `<div class="note">📝 <b>Customer Note:</b> ${escapeHTML(order.instructions)}</div>`
                : "";

            let actionsHTML = "";

            if (order.status !== "COMPLETED") {
                let buttons = "";

                if (order.status !== "PREPARING") {
                    buttons += `
                        <button class="preparing-btn" data-order="${order.id}" data-status="PREPARING">
                            👨‍🍳 Preparing
                        </button>
                    `;
                }

                if (order.status !== "READY") {
                    buttons += `
                        <button class="ready-btn" data-order="${order.id}" data-status="READY">
                            ✅ Ready
                        </button>
                    `;
                }

                buttons += `
                    <button class="complete-btn" data-order="${order.id}" data-status="COMPLETED">
                        ✔ Completed
                    </button>
                `;

                buttons += `
                    <button class="delete-btn" data-order="${order.id}" data-action="delete">
                        🗑 Delete
                    </button>
                `;

                actionsHTML = `<div class="actions">${buttons}</div>`;
            }

            return `
                <div class="order ${statusClass}" id="order-card-${order.id}">

                    <div class="order-top">
                        <h2 class="order-number">Order #${order.id}</h2>
                        ${statusBadge}
                    </div>

                    <div class="order-info">
                        <p><b>🪑 Table:</b> ${escapeHTML(order.table_number)}</p>
                        <p><b>👤 Customer:</b> ${escapeHTML(order.customer_name)}</p>
                        <p><b>📞 Phone:</b> ${escapeHTML(order.customer_phone)}</p>
                        <p><b>💳 Payment:</b> ${escapeHTML(order.payment_method)}</p>
                        ${order.address ? '<p><b>📍 Address:</b> ' + escapeHTML(order.address) + '</p>' : ''}
                        ${order.map_link ? '<p><b>🗺️ Map:</b> <a href="' + escapeHTML(order.map_link) + '" target="_blank" rel="noopener" style="color:#4285F4;text-decoration:underline;">Open Location</a></p>' : ''}
                        <p><b>🕒 Ordered:</b> ${escapeHTML(order.created_at)}</p>
                    </div>

                    <h3 class="items-title">🍽️ Items</h3>

                    <ul class="items-list">
                        ${itemsHTML}
                    </ul>

                    <div class="total">
                        Total: OMR ${order.total.toFixed(3)}
                    </div>

                    ${noteHTML}

                    ${actionsHTML}

                </div>
            `;
        }


        // =============================================
        // ATTACH STATUS BUTTONS
        // =============================================

        function attachStatusButtons() {
            // Status update buttons
            const statusBtns = document.querySelectorAll("[data-status]");
            statusBtns.forEach(function(btn) {
                btn.addEventListener("click", function() {
                    const orderId = this.dataset.order;
                    const status = this.dataset.status;
                    updateOrderStatus(orderId, status);
                });
            });

            // Delete buttons
            const deleteBtns = document.querySelectorAll("[data-action='delete']");
            deleteBtns.forEach(function(btn) {
                btn.addEventListener("click", function() {
                    const orderId = this.dataset.order;
                    if (confirm("Delete order #" + orderId + "?")) {
                        deleteOrder(orderId);
                    }
                });
            });
        }


        // =============================================
        // UPDATE ORDER STATUS (AJAX)
        // =============================================

        async function updateOrderStatus(orderId, status) {
            const card = document.getElementById("order-card-" + orderId);
            if (card) card.classList.add("updating");

            try {
                const response = await fetch(
                    "/update-status/" + orderId + "/" + status,
                    { method: "POST" }
                );

                const data = await response.json();

                if (data.success) {
                    showToast("Order #" + orderId + " → " + status);
                    fetchOrders();
                } else {
                    showToast(data.message || "Failed to update", "error");
                }
            } catch (error) {
                showToast("Network error", "error");
            }

            if (card) card.classList.remove("updating");
        }


        // =============================================
        // DELETE ORDER (AJAX)
        // =============================================

        async function deleteOrder(orderId) {
            try {
                const response = await fetch(
                    "/delete-order/" + orderId,
                    { method: "POST" }
                );

                const data = await response.json();

                if (data.success) {
                    showToast("Order #" + orderId + " deleted");
                    fetchOrders();
                } else {
                    showToast(data.message || "Failed to delete", "error");
                }
            } catch (error) {
                showToast("Network error", "error");
            }
        }


        // =============================================
        // TOAST NOTIFICATION
        // =============================================

        function showToast(message, type) {
            const existing = document.querySelector(".admin-toast");
            if (existing) existing.remove();

            const toast = document.createElement("div");
            toast.className = "admin-toast" + (type === "error" ? " error" : "");
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(function() { toast.classList.add("show"); }, 10);

            setTimeout(function() {
                toast.classList.remove("show");
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }


        // =============================================
        // ESCAPE HTML
        // =============================================

        function escapeHTML(str) {
            if (!str) return "";
            const div = document.createElement("div");
            div.textContent = String(str);
            return div.innerHTML;
        }

    </script>


</body>

</html>
