<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AKFAA Coffee Shop | مقهى أكفاء</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

</head>


<body>

    <!-- MAIN APPLICATION -->

    <main class="restaurant-app">


        <!-- LEFT SIDE -->

        <section class="menu-area">


            <!-- HEADER -->

            <header class="menu-header">

                <div class="brand">

                    <img
                        src="{{ url_for('static', filename='images/logo.png') }}"
                        alt="AKFAA Coffee Shop"
                        class="logo">

                    <div>

                        <h1>
                            AKFAA Coffee Shop
                        </h1>

                        <p>
                            أكفاء للأعمال والتطوير
                        </p>

                    </div>

                </div>


                <button
                    type="button"
                    class="mobile-cart-button"
                    onclick="toggleMobileCart()">

                    🛒
                    <span id="mobile-cart-count">
                        0
                    </span>

                </button>

            </header>


            <!-- MENU -->

            <div
                id="menu-container"
                class="menu-categories">

                <!-- JavaScript creates categories -->

            </div>


        </section>


        <!-- RIGHT ORDER PANEL -->

        <aside
            class="order-panel"
            id="order-panel">


            <!-- ORDER HEADER -->

            <div class="order-header">

                <h2>
                    Your Order
                </h2>

                <button
                    type="button"
                    class="close-mobile-cart"
                    onclick="toggleMobileCart()">

                    ×

                </button>

            </div>


            <!-- CART ITEMS -->

            <div
                id="cart-items"
                class="order-items">

            </div>


            <!-- CHECKOUT -->

            <div class="checkout-section">


                <div class="total-row">

                    <span>
                        Total:
                    </span>

                    <strong id="cart-total-price">

                        OMR 0.000

                    </strong>

                </div>


                <!-- TABLE -->

                <div class="form-field">

                    <label for="table-number">

                        Table Number:

                    </label>

                    <input
                        type="text"
                        id="table-number"
                        value="{{ table_no }}"
                        readonly>

                </div>


                <!-- CUSTOMER NAME -->

                <div class="form-field">

                    <label for="customer-name">

                        Name

                    </label>

                    <input
                        type="text"
                        id="customer-name"
                        placeholder="Enter your name">

                </div>


                <!-- PHONE -->

                <div class="form-field">

                    <label for="customer-phone">

                        Phone

                    </label>

                    <input
                        type="tel"
                        id="customer-phone"
                        placeholder="Enter phone number">

                </div>


                <!-- SPECIAL -->

                <div class="form-field">

                    <label for="customer-instructions">

                        Special Instructions

                    </label>

                    <textarea
                        id="customer-instructions"
                        placeholder="Any special request?"></textarea>

                </div>


                <!-- PAYMENT -->

                <div class="payment-section">

                    <label>
                        Payment Method
                    </label>

                    <div class="payment-options">

                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="Pay at Counter"
                                checked>

                            Pay at Counter

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="Cash">

                            Cash

                        </label>

                    </div>

                </div>


                <!-- PLACE ORDER -->

                <button
                    type="button"
                    id="place-order-button"
                    class="place-order-btn">

                    PLACE ORDER

                </button>


            </div>


        </aside>


    </main>


    <!-- MOBILE OVERLAY -->

    <div
        class="mobile-overlay"
        id="mobile-overlay"
        onclick="toggleMobileCart()">

    </div>


    <!-- MENU DATA -->

    <script
        src="{{ url_for('static', filename='js/menu-data.js') }}">
    </script>


    <!-- WEBSITE LOGIC -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>


</body>

</html><script src="{{ url_for('static', filename='js/menu-data.js') }}"></script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
